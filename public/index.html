<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리아이들 보육일지 AI — 영유아교육디자인연구소</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #faf7f0; min-height: 100vh; }

  /* ─── 인증 게이트 ─── */
  #gate { position: fixed; inset: 0; z-index: 3000; background: #1a3a5c; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  #gate.hidden { display: none; }
  .gate-box { background: #faf7f0; border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .gate-box .g-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
  .gate-box h2 { font-family: 'Noto Serif KR', serif; font-size: 1.2rem; color: #1a3a5c; margin-bottom: 0.4rem; }
  .gate-box p { font-size: 0.82rem; color: #8a7f6f; margin-bottom: 1.5rem; line-height: 1.5; }
  .gate-box input { width: 100%; padding: 13px 16px; border: 2px solid #e8e2d5; border-radius: 12px; font-size: 0.95rem; text-align: center; font-weight: 500; color: #1a3a5c; outline: none; transition: border 0.2s; background: #fff; }
  .gate-box input:focus { border-color: #c89b4a; }
  .gate-box input + input { margin-top: 10px; }
  .gate-box button { width: 100%; margin-top: 0.9rem; padding: 13px; border: none; border-radius: 12px; background: #1a3a5c; color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit; }
  .gate-box button:hover { background: #234a73; }
  .gate-box button:disabled { background: #b0a89a; cursor: wait; }
  .gate-error { margin-top: 0.8rem; font-size: 0.8rem; color: #c0392b; min-height: 1.2em; line-height: 1.5; word-break: keep-all; }

  /* ─── 런처 ─── */
  #launcher { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; gap: 2rem; }
  .launcher-logo { font-size: 3rem; }
  .launcher-title { font-family: 'Noto Serif KR', serif; font-size: 1.6rem; font-weight: 600; color: #1a3a5c; text-align: center; }
  .launcher-sub { font-size: 0.88rem; color: #8a7f6f; margin-top: 8px; font-family: 'Noto Sans KR', sans-serif; font-weight: 400; }
  .launcher-cards { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
  .launcher-card { width: 260px; background: #fff; border: 1px solid #e8e2d5; border-radius: 16px; padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.25s; box-shadow: 0 2px 8px rgba(26,58,92,0.06); }
  .launcher-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(26,58,92,0.12); border-color: #c89b4a; }
  .launcher-card .lc-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
  .launcher-card .lc-name { font-family: 'Noto Serif KR', serif; font-size: 1.15rem; font-weight: 600; color: #1a3a5c; margin-bottom: 0.5rem; }
  .launcher-card .lc-desc { font-size: 0.82rem; color: #8a7f6f; line-height: 1.5; }
  .launcher-card .lc-badge { display: inline-block; margin-top: 0.9rem; font-size: 0.74rem; padding: 4px 12px; border-radius: 99px; background: #c89b4a; color: #fff; font-weight: 500; }
  .launcher-card .lc-badge.low { background: #c0392b; }
  .launcher-footer { font-size: 0.75rem; color: #b0a89a; display: flex; gap: 14px; align-items: center; }
  .launcher-footer button { background: none; border: 1px solid #d8d0c0; color: #8a7f6f; font-size: 0.72rem; padding: 5px 12px; border-radius: 99px; cursor: pointer; font-family: inherit; }
  .launcher-footer button:hover { border-color: #c89b4a; color: #c89b4a; }
</style>
</head>
<body>

<!-- ─── 수업 비밀번호 + 전화번호 인증 ─── -->
<div id="gate">
  <div class="gate-box">
    <div class="g-icon">🔐</div>
    <h2>수업 비밀번호와 전화번호를 입력해 주세요</h2>
    <p>이 도구는 영유아교육디자인연구소 교육 참여자<br>전용입니다. 강의에서 안내받은 비밀번호를 입력하세요.</p>
    <input type="text" id="gatePw" placeholder="수업 비밀번호" autocomplete="off"
           onkeydown="if(event.key==='Enter') verifyLogin()">
    <input type="tel" id="gatePhone" placeholder="휴대폰 번호 (010-1234-5678)" autocomplete="tel"
           onkeydown="if(event.key==='Enter') verifyLogin()">
    <button id="gateBtn" onclick="verifyLogin()">입장하기</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<!-- ─── 런처: 도구 선택 ─── -->
<div id="launcher">
  <div class="launcher-logo">🌱</div>
  <div class="launcher-title">우리아이들 보육일지 AI<div class="launcher-sub">영유아교육디자인연구소</div></div>
  <div class="launcher-cards">
    <div class="launcher-card" onclick="location.href='daily.html'">
      <div class="lc-icon">📋</div>
      <div class="lc-name">일일 보육일지 분석</div>
      <div class="lc-desc">하루의 보육일지를 입력하면<br>AI가 분석하고<br>개선 문단을 제안합니다</div>
      <div class="lc-badge" id="badgeDaily">잔여 확인 중...</div>
    </div>
    <div class="launcher-card" onclick="location.href='weekly.html'">
      <div class="lc-icon">📊</div>
      <div class="lc-name">주간 보육일지 분석</div>
      <div class="lc-desc">일주일치 보육일지의 흐름을<br>분석하고 다음 주 계획을<br>추천합니다</div>
      <div class="lc-badge" id="badgeWeekly">잔여 확인 중...</div>
    </div>
  </div>
  <div class="launcher-footer">
    <span>v0.5 · 분석할 도구를 선택해 주세요</span>
    <button onclick="reRegister()">🔑 다시 등록</button>
  </div>
</div>

<script>
// ─── 잔여 횟수를 런처 카드에 표시 ───
function updateCardBadges(data) {
  const d = document.getElementById('badgeDaily');
  const w = document.getElementById('badgeWeekly');
  if (data.remaining_daily !== undefined) {
    d.textContent = '잔여 ' + data.remaining_daily + '회';
    d.classList.toggle('low', data.remaining_daily <= 10);
  }
  if (data.remaining_weekly !== undefined) {
    w.textContent = '잔여 ' + data.remaining_weekly + '회';
    w.classList.toggle('low', data.remaining_weekly <= 10);
  }
}

// ─── 등록 / 입장 ───
async function verifyLogin() {
  const pw = document.getElementById('gatePw').value.trim();
  const phoneRaw = document.getElementById('gatePhone').value.trim();
  const btn = document.getElementById('gateBtn');
  const err = document.getElementById('gateError');
  if (!pw) { err.textContent = '수업 비밀번호를 입력해 주세요.'; return; }
  if (!phoneRaw) { err.textContent = '휴대폰 번호를 입력해 주세요.'; return; }
  btn.disabled = true; btn.textContent = '확인 중...'; err.textContent = '';
  try {
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verify: true, password: pw, phone: phoneRaw })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || '인증에 실패했습니다.');
    localStorage.setItem('wm_phone', phoneRaw.replace(/\D/g, ''));
    updateCardBadges(data);
    document.getElementById('gate').classList.add('hidden');
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = '입장하기';
  }
}

// ─── 자동 입장 (이미 등록된 전화번호) ───
(async function autoLogin() {
  const phone = localStorage.getItem('wm_phone') || '';
  if (!phone) return;
  try {
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verify: true, phone })
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      updateCardBadges(data);
      document.getElementById('gate').classList.add('hidden');
    } else {
      localStorage.removeItem('wm_phone');
      if (data.reason === 'exhausted') {
        document.getElementById('gateError').textContent = data.error || '';
      }
    }
  } catch (e) { /* 네트워크 오류 시 게이트 유지 */ }
})();

// ─── 다른 번호로 다시 등록 ───
function reRegister() {
  localStorage.removeItem('wm_phone');
  document.getElementById('gatePw').value = '';
  document.getElementById('gatePhone').value = '';
  document.getElementById('gateError').textContent = '';
  document.getElementById('gate').classList.remove('hidden');
}
</script>
</body>
</html>
